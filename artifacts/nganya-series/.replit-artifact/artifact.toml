kind = "web"
previewPath = "/"
title = "NGANYA SERIES"
version = "1.0.0"
id = "artifacts/nganya-series"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22545

[services.development]
run = "pnpm --filter @workspace/nganya-series run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nganya-series", "run", "build" ]
publicDir = "artifacts/nganya-series/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22545"
BASE_PATH = "/"
